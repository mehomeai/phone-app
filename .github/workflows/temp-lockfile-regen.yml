name: TEMP lockfile regen (corrective PR, delete before merge)

# Temporary, manually dispatched workflow for the babel lockfile
# corrective PR (Codex ruling 2026-11-04). It regenerates
# apps/mobile/package-lock.json on a GitHub-hosted runner and uploads it
# as an artifact for human review. It never commits. This file is
# deleted in a follow-up commit before the corrective PR is opened.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regen-lockfile:
    name: Regenerate mobile lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.18.0"
      - name: Record branch SHA and tool versions
        run: |
          mkdir -p regen-evidence
          {
            echo "branch: ${{ github.ref_name }}"
            echo "sha: $(git rev-parse HEAD)"
            echo "node: $(node --version)"
            echo "npm: $(npm --version)"
          } | tee regen-evidence/versions.txt
      - name: Regenerate lockfile (package-lock only)
        working-directory: apps/mobile
        run: |
          set -o pipefail
          npm install --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org/ 2>&1 | tee ../../regen-evidence/npm-install-package-lock-only.log
      - name: Verify clean install from regenerated lockfile
        working-directory: apps/mobile
        run: |
          set -o pipefail
          npm ci 2>&1 | tee ../../regen-evidence/npm-ci.log
      - name: Show installed @babel/core
        working-directory: apps/mobile
        run: |
          set -o pipefail
          npm ls @babel/core 2>&1 | tee ../../regen-evidence/npm-ls-babel-core.log
      - name: Stage regenerated lockfile for upload
        run: cp apps/mobile/package-lock.json regen-evidence/package-lock.json
      - name: Upload lockfile and execution evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regenerated-lockfile
          path: regen-evidence/
          if-no-files-found: error
