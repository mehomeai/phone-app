# TEMPORARY — lockfile regeneration for SDK 58 PR A (Ticket 5).
# Reuses the PR #12 mechanism: workflow_dispatch 404s for workflows absent
# from the default branch, so this workflow self-triggers on pushes to this
# branch that touch this file. Read-only: no secrets, never commits, never
# pushes. DELETE THIS FILE before the PR is finished; the final diff must
# contain none of it.
name: Lockfile regen SDK58 PR A (temporary)

on:
  push:
    branches: [sdk58-pr-a-baseline]
    paths:
      - .github/workflows/lockfile-regen-sdk58-a.yml

permissions:
  contents: read

jobs:
  regen:
    name: Regenerate mobile lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.18.0"
      - name: Record source revision and toolchain
        run: |
          {
            echo "source SHA: $(git rev-parse HEAD)"
            echo "source branch: $(git rev-parse --abbrev-ref HEAD)"
            echo "node: $(node --version)"
            echo "npm: $(npm --version)"
          } | tee ../regen-versions.txt
          git rev-parse HEAD > ../regen-source-sha.txt
      - name: Regenerate lockfile from existing lockfile (targeted install)
        run: |
          npm install --package-lock-only --ignore-scripts 2>&1 | tee ../regen-log.txt
          echo "--- npm ci verification ---" >> ../regen-log.txt
          npm ci 2>&1 | tee -a ../regen-log.txt
      - name: Verify resolved versions
        run: |
          {
            echo "--- npm ls ---"
            npm ls react react-dom react-native react-native-safe-area-context expo-notifications @types/react-dom @babel/core react-native-reanimated react-native-worklets
            echo "--- expo install --check ---"
            npx --no-install expo install --check || true
          } | tee -a ../regen-log.txt
      - name: Upload lockfile and generation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk58-pr-a-lockfile-${{ github.run_id }}
          path: |
            apps/mobile/package-lock.json
            regen-log.txt
            regen-versions.txt
            regen-source-sha.txt
          if-no-files-found: error
